<!-- =========================================================
     CRUISE LENS ACADEMY - HEADER / NAVBAR
     ========================================================= -->

<nav class="navbar navbar-expand-xl cla-navbar">

  <div class="container-fluid cla-navbar-container">

    <!-- =====================================================
         LOGO + BRAND
         ===================================================== -->

    <a
      class="navbar-brand cla-brand"
      routerLink="/home"
      aria-label="Cruise Lens Academy Home">

      <!-- CLA Logo -->
      <img
        src="assets/images/logo.png"
        alt="Cruise Lens Academy Logo"
        class="cla-logo"
      />

      <!-- Brand Text -->
      <div class="cla-brand-text">

        <span class="brand-text">
          Cruise Lens Academy
        </span>

        <span class="brand-tagline">
          Dock Here, Sail Everywhere
        </span>

      </div>

    </a>


    <!-- =====================================================
         MOBILE TOGGLER
         ===================================================== -->

    <button
      class="navbar-toggler border-0 shadow-none"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>

    </button>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <div
      class="collapse navbar-collapse cla-navbar-collapse"
      id="navbarNav">


      <!-- ===================================================
           MENU LINKS
           =================================================== -->

      <ul class="navbar-nav cla-nav-links">


        <!-- ================= HOME ================= -->

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/home"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeNavbar()">

            Home

          </a>

        </li>


        <!-- ================= ABOUT ================= -->

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/about"
            routerLinkActive="active"
            (click)="closeNavbar()">

            About CLA

          </a>

        </li>


        <!-- ================= PROGRAMS DROPDOWN ================= -->

        <li class="nav-item dropdown">

          <a
            class="nav-link dropdown-toggle"
            href="#"
            id="programsDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">

            Programs

          </a>


          <ul
            class="dropdown-menu shadow-lg border-0"
            aria-labelledby="programsDropdown">


            <!-- Program 1 -->

            <li>

              <a
                class="dropdown-item"
                routerLink="/certification-cruise-photography"
                (click)="closeNavbar()">

                Certification in Cruise Photography

              </a>

            </li>


            <!-- Program 2 -->

            <li>

              <a
                class="dropdown-item"
                routerLink="/complete-cruise-career"
                (click)="closeNavbar()">

                Complete Cruise Career Program

              </a>

            </li>

          </ul>

        </li>


        <!-- ================= CREW DECK ================= -->

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/photographers"
            routerLinkActive="active"
            (click)="closeNavbar()">

            Crew Deck

          </a>

        </li>


        <!-- ================= SUCCESS STORIES ================= -->

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/success-stories"
            routerLinkActive="active"
            (click)="closeNavbar()">

            Success Stories

          </a>

        </li>


        <!-- ================= FAQS ================= -->

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/faq"
            routerLinkActive="active"
            (click)="closeNavbar()">

            FAQs

          </a>

        </li>


        <!-- ================= CONTACT ================= -->

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/contact"
            routerLinkActive="active"
            (click)="closeNavbar()">

            Contact

          </a>

        </li>

      </ul>


      <!-- ===================================================
           RIGHT HEADER ACTION AREA
           =================================================== -->

      <div class="cla-header-actions">


        <!-- =================================================
             TRAINING / CERTIFICATION PARTNERS
             ================================================= -->

        <div
          class="partner-lockup"
          aria-label="Training and certification partners">


          <!-- LEFT DIVIDER -->

          <div class="partner-divider"></div>


          <!-- =================================================
               PARTNER CONTENT
               ================================================= -->

          <div class="partner-content">


            <!-- Partner Heading -->

            <span class="partner-heading">

              Approved Training Partner of

            </span>


            <!-- =================================================
                 PARTNER LOGOS
                 ================================================= -->

            <div class="partner-logos-row">


              <!-- =============================================
                   MEDHAVI SKILLS UNIVERSITY
                   ============================================= -->

              <img
                src="assets/images/madhavi-skills-university-logo-white-bg.jpg"
                alt="Medhavi Skills University"
                class="msu-logo"
              />


              <!-- =============================================
                   SKILL INDIA
                   ============================================= -->

              <img
                src="assets/images/skill-india-logo.png"
                alt="Skill India"
                class="skill-india-logo"
              />

            </div>

          </div>


          <!-- RIGHT DIVIDER -->

          <div class="partner-divider"></div>

        </div>


        <!-- =================================================
             APPLY NOW
             ================================================= -->

        <div class="apply-container">


          <!-- Apply Button -->

          <a
            class="cta-btn apply-btn btn-gold-solid"
            routerLink="/apply-now"
            (click)="closeNavbar()"
            aria-label="Apply now to Cruise Lens Academy">

            <span>
              APPLY NOW
            </span>

            <i
              class="fa-solid fa-arrow-right"
              aria-hidden="true">
            </i>

          </a>


          <!-- Limited Seats -->

          <span class="limited-seats-text">

            Limited Seats - Enroll Today!

          </span>

        </div>

      </div>

    </div>

  </div>

</nav>
