<!-- ================= HEADER / NAVBAR ================= -->

<nav class="navbar navbar-expand-xl cla-navbar">

  <div class="container-fluid cla-navbar-container">

    <!-- ================= LOGO + BRAND ================= -->

    <a
      class="navbar-brand cla-brand"
      routerLink="/home"
      aria-label="Cruise Lens Academy Home">

      <img
        src="assets/images/logo.png"
        alt="Cruise Lens Academy Logo"
        class="cla-logo"
      />

      <div class="cla-brand-text">

        <span class="brand-text">
          Cruise Lens Academy
        </span>

        <span class="brand-tagline">
          Dock Here, Sail Everywhere
        </span>

      </div>

    </a>


    <!-- ================= MOBILE TOGGLER ================= -->

    <button
      class="navbar-toggler border-0 shadow-none"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>

    </button>


    <!-- ================= NAVIGATION ================= -->

    <div
      class="collapse navbar-collapse cla-navbar-collapse"
      id="navbarNav">

      <!-- ================= MENU LINKS ================= -->

      <ul class="navbar-nav cla-nav-links">

        <!-- Home -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/home"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeNavbar()">

            Home

          </a>

        </li>


        <!-- About -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/about"
            routerLinkActive="active"
            (click)="closeNavbar()">

            About CLA

          </a>

        </li>


        <!-- Programs Dropdown -->
        <li class="nav-item dropdown">

          <a
            class="nav-link dropdown-toggle"
            href="#"
            id="programsDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">

            Programs

          </a>

          <ul
            class="dropdown-menu shadow-lg border-0"
            aria-labelledby="programsDropdown">

            <!-- Program 1 -->
            <li>

              <a
                class="dropdown-item"
                routerLink="/certification-cruise-photography"
                (click)="closeNavbar()">

                Certification in Cruise Photography

              </a>

            </li>


            <!-- Program 2 -->
            <li>

              <a
                class="dropdown-item"
                routerLink="/complete-cruise-career"
                (click)="closeNavbar()">

                Complete Cruise Career Program

              </a>

            </li>

          </ul>

        </li>


        <!-- Crew Deck -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/photographers"
            routerLinkActive="active"
            (click)="closeNavbar()">

            Crew Deck

          </a>

        </li>


        <!-- Success Stories -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/success-stories"
            routerLinkActive="active"
            (click)="closeNavbar()">

            Success Stories

          </a>

        </li>


        <!-- FAQs -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/faq"
            routerLinkActive="active"
            (click)="closeNavbar()">

            FAQs

          </a>

        </li>


        <!-- Contact -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/contact"
            routerLinkActive="active"
            (click)="closeNavbar()">

            Contact

          </a>

        </li>

      </ul>


      <!-- ================= RIGHT ACTION AREA ================= -->

      <div class="cla-header-actions">


        <!-- ================= PARTNERS ================= -->

        <div
          class="partner-lockup"
          aria-label="Training and certification partners">

          <!-- Divider -->
          <div class="partner-divider"></div>


          <!-- Partner Content: Heading + Both Logos in one row -->
          <div class="partner-content">

            <span class="partner-heading">
              Approved Training Partner of
            </span>

            <div class="partner-logos-row">

              <!-- MSU -->
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Medhavi_Skills_University_official_Logo.png/1280px-Medhavi_Skills_University_official_Logo.png"
                alt="Medhavi Skills University"
                class="msu-logo"
              />

              <!-- Skill India -->
              <img
                src="assets/images/skill-india-logo.png"
                alt="Skill India"
                class="skill-india-logo"
              />

            </div>

          </div>


          <!-- Divider -->
          <div class="partner-divider"></div>

        </div>


        <!-- ================= APPLY BUTTON ================= -->

        <div class="apply-container">

          <a
            class="cta-btn apply-btn btn-gold-solid"
            routerLink="/apply-now"
            (click)="closeNavbar()"
            aria-label="Apply now to Cruise Lens Academy">

            <span>
              APPLY NOW
            </span>

            <i
              class="fa-solid fa-arrow-right"
              aria-hidden="true">
            </i>

          </a>


          <span class="limited-seats-text">
            Limited Seats - Enroll Today!
          </span>

        </div>

      </div>

    </div>

  </div>

</nav>
